# ===============================
# 1. CẤU HÌNH DỰ ÁN CƠ BẢN
# ===============================
spring.application.name=optistock-backend

# Cổng chạy Server
server.port=8080

# Làm đẹp dữ liệu JSON trả về
spring.jackson.serialization.indent_output=true

# ===============================
# 2. CẤU HÌNH DATABASE (MONGODB)
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/optistock_db

# ===============================
# 3. CẤU HÌNH BẢO MẬT (JWT)
# ===============================
# CẢNH BÁO: Thay đổi secret key này bằng chuỗi ngẫu nhiên dài!
optistock.app.jwtSecret=OptiStockSecretKeyDungDeKyTokenJWTPhaiRatDaiVaBaoMat123456789!@#$%^&*()
# Thời gian hết hạn token: 86400000ms = 24h
optistock.app.jwtExpirationMs=86400000

# ===============================
# 4. CẤU HÌNH EMAIL (GMAIL SMTP)
# ===============================
# Để sử dụng Gmail SMTP, bạn PHẢI:
# 1. Bật 2-Step Verification
# 2. Tạo App Password tại https://myaccount.google.com/apppasswords
# 3. Thay email và app password bên dưới
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# 5. CẤU HÌNH GOOGLE OAUTH2
# ===============================
# Lấy từ Google Cloud Console: https://console.cloud.google.com
google.client.id=YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com